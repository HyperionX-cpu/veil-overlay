<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEIL Stream Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      color: #ffffff;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Core Sleek Black & White Card */
    .card {
      background: rgba(10, 10, 12, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-radius: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      position: relative;
      overflow: hidden;
    }

    /* Animated Light Sweep Across Cards */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      animation: sheen 6s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes sheen {
      0%, 60% { left: -150%; }
      100% { left: 150%; }
    }

    /* Top Header Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 34px;
    }

    .live-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 16px #ffffff;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.45; }
    }

    .brand-name {
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 2.5px;
    }

    .divider-v {
      width: 2px;
      height: 30px;
      background: rgba(255, 255, 255, 0.3);
    }

    .brand-domain {
      font-size: 28px;
      color: #ffffff;
      font-weight: 700;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 30px;
    }

    .status-label {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
    }

    .status-badge {
      background: #ffffff;
      color: #09090b;
      font-size: 21px;
      font-weight: 900;
      padding: 10px 20px;
      border-radius: 10px;
      letter-spacing: 1px;
    }

    /* Main Pricing Card */
    .pricing-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
    }

    .pricing-card {
      width: 640px;
      padding: 36px;
      animation: floatCard 5s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 22px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
    }

    .card-header svg {
      width: 34px;
      height: 34px;
      stroke: #ffffff;
    }

    .card-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    /* Pricing Rows */
    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tier-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
    }

    /* Highlighted Lifetime Row with Breathing Glow */
    .tier-row.featured {
      background: rgba(255, 255, 255, 0.12);
      border: 2.5px solid #ffffff;
      animation: borderGlow 3s infinite alternate ease-in-out;
    }

    @keyframes borderGlow {
      0% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
      100% { box-shadow: 0 0 28px rgba(255, 255, 255, 0.55); }
    }

    .tier-name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
    }

    .tier-price {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
    }

    /* Trust Footer Button */
    .trust-banner {
      margin-top: 26px;
      padding: 22px;
      text-align: center;
      border-radius: 14px;
      border: 2px solid #ffffff;
      background: rgba(255, 255, 255, 0.08);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.8px;
    }

    /* Bottom Live Activity Toast */
    .bottom-bar {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
    }

    .toast-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 32px;
      min-width: 560px;
      animation: slideToast 7s infinite ease-in-out;
    }

    @keyframes slideToast {
      0%, 100% { transform: translateX(-15px); opacity: 0; }
      12%, 88% { transform: translateX(0); opacity: 1; }
    }

    .toast-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
    }

    .toast-icon svg {
      width: 26px;
      height: 26px;
    }

    .toast-text {
      font-size: 25px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .toast-text strong {
      color: #ffffff;
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- Top Section -->
  <div>
    <div class="top-bar">
      <div class="card brand-pill">
        <div class="live-dot"></div>
        <span class="brand-name">VEIL</span>
        <div class="divider-v"></div>
        <span class="brand-domain">vielshop.top</span>
      </div>

      <div class="card status-pill">
        <span class="status-label">STATUS:</span>
        <span class="status-badge">ONLINE // LIVE</span>
      </div>
    </div>

    <!-- Pricing Card -->
    <div class="pricing-wrapper">
      <div class="card pricing-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
          <span class="card-title">VEIL SETUP &amp; LICENSES</span>
        </div>

        <div class="tier-list">
          <div class="tier-row">
            <span class="tier-name">1 Day Access</span>
            <span class="tier-price">$5.00</span>
          </div>
          <div class="tier-row">
            <span class="tier-name">7 Day Access</span>
            <span class="tier-price">$15.00</span>
          </div>
          <div class="tier-row">
            <span class="tier-name">30 Day Access</span>
            <span class="tier-price">$30.00</span>
          </div>
          <div class="tier-row featured">
            <span class="tier-name">Lifetime Access</span>
            <span class="tier-price">$100.00</span>
          </div>
        </div>

        <div class="trust-banner">
          VEIL IS 100% SECURE &amp; TRUSTED
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Live Notification -->
  <div class="bottom-bar">
    <div class="card toast-card">
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div class="toast-text" id="toast-msg">
        <strong>vKilla***</strong> joined the discord
      </div>
    </div>
  </div>

  <script>
    const events = [
      "<strong>vKilla***</strong> joined the discord",
      "<strong>zNova***</strong> activated Lifetime Access",
      "<strong>Kairo***</strong> joined the discord",
      "<strong>Raze***</strong> activated 30 Day Access"
    ];
    let idx = 0;
    const toastEl = document.getElementById("toast-msg");

    setInterval(() => {
      idx = (idx + 1) % events.length;
      toastEl.innerHTML = events[idx];
    }, 7000);
  </script>

</body>
</html>
